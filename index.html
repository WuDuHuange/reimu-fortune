<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>博丽灵梦的每日一签</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Noto Serif JP', serif;
      }
      /* Tailwind animate-in utilities */
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes slideInFromRight {
        from { transform: translateX(10px); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
      }
      @keyframes slideInFromTop {
        from { transform: translateY(-10px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      @keyframes slideInFromBottom {
        from { transform: translateY(10px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      @keyframes zoomIn {
        from { transform: scale(0.9); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
      }
      .animate-in {
        animation-duration: 0.3s;
        animation-fill-mode: both;
      }
      .fade-in { animation-name: fadeIn; }
      .slide-in-from-right { animation-name: slideInFromRight; }
      .slide-in-from-top-2 { animation-name: slideInFromTop; }
      .slide-in-from-bottom-2 { animation-name: slideInFromBottom; }
      .slide-in-from-left-2 { animation-name: slideInFromRight; animation-direction: reverse; }
      .zoom-in { animation-name: zoomIn; }
    </style>
  </head>
  <body class="bg-red-50 text-slate-800">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
